<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test Article</title>
  </head>
  <body>
    <article>
      <h1>Sample Article Title</h1>
      <p class="metadata">Published: January 15, 2024</p>
      <div class="content">
        <p>This is the first paragraph of the article content.</p>
        <p>This is the second paragraph with <strong>bold text</strong>.</p>
      </div>
      <a href="https://example.com/source" class="source-link">Source Link</a>
      <img src="https://example.com/image.jpg" alt="Article Image" />
      <div data-price="29.99" data-currency="USD" data-category="technology">Price Info</div>
      <span class="author" title="John Doe">Author Name</span>
      <input type="hidden" value="hidden-value" class="hidden-field" />
    </article>
  </body>
</html>
