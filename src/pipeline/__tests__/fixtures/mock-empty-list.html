<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empty Results</title>
  </head>
  <body>
    <main class="empty-container">
      <h1>Search Results</h1>

      <!-- Container exists but is empty -->
      <div class="search-results">
        <!-- No items here -->
      </div>

      <div class="empty-state">
        <p class="empty-message">No results found for your search.</p>
        <p class="empty-suggestion">Try adjusting your search criteria.</p>
      </div>

      <div class="search-meta">
        <span class="result-count">0 results found</span>
      </div>
    </main>
  </body>
</html>
